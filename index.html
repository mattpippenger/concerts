<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pip's Concert Tracker</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#20283f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Concerts" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- top stub -->
  <header class="masthead">
    <div class="masthead-left">
      <div class="admit-one">ADMIT ONE</div>
      <h1 class="title">CONCERT&nbsp;TRACKER</h1>
      <div class="subtitle">Pip's lifetime of live music &mdash; one stub at a time</div>
    </div>
    <div class="masthead-right">
      <div class="serial" id="masthead-serial">No.&nbsp;000000</div>
      <div class="meta-line" id="masthead-meta">loading&hellip;</div>
      <button class="nav-toggle" id="nav-toggle" aria-label="Open navigation">&#9776;</button>
    </div>
  </header>

  <div class="mobile-nav" id="mobile-nav">
    <button class="mobile-nav-item is-active" data-view="overview">Overview</button>
    <button class="mobile-nav-item" data-view="onthisday">On This Day</button>
    <button class="mobile-nav-item" data-view="artists">Artists</button>
    <button class="mobile-nav-item" data-view="venues">Venues</button>
    <button class="mobile-nav-item" data-view="timeline">Timeline</button>
    <button class="mobile-nav-item" data-view="search">Search</button>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab is-active" data-view="overview">Overview</button>
    <button class="tab" data-view="onthisday">On This Day</button>
    <button class="tab" data-view="artists">Artists</button>
    <button class="tab" data-view="venues">Venues</button>
    <button class="tab" data-view="timeline">Timeline</button>
    <button class="tab" data-view="search">Search</button>
  </nav>

  <main id="app">
    <!-- views are rendered here by app.js -->
    <div class="loading" id="loading">Tearing the stub&hellip;</div>
  </main>

  <footer class="footer">
    <div class="theme-picker" id="theme-picker"><span class="tp-label">Theme</span></div>
    <span class="footer-hint"><span id="footer-meta"></span></span>
  </footer>

  <!-- Add Show -->
  <button class="add-show-fab" id="add-show-fab" aria-label="Add a show">+</button>

  <div class="add-modal-overlay" id="add-modal-overlay" aria-hidden="true">
    <div class="add-modal" id="add-modal" role="dialog" aria-modal="true" aria-label="Add Show">
      <button class="add-modal-close" id="add-modal-close" aria-label="Close">&times;</button>
      <div class="add-modal-body" id="add-modal-body">
        <!-- content rendered by app.js -->
      </div>
    </div>
  </div>

  <!-- data + config load before the app logic -->
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="tour-data.js"></script>
  <script src="app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(console.error);
    }
  </script>
</body>
</html>
